<tspan x="698" dy="22">• train / val dataloader</tspan>
<tspan x="698" dy="22">• ResourcePoolManager</tspan>
</text>
<rect x="1105" y="275" width="210" height="130" rx="10" fill="#e6f4ff" stroke="#0958d9" stroke-width="2" filter="url(#shadow)" />
