<rect x="720" y="740" width="390" height="340" rx="10" fill="#f6ffed" stroke="#389e0d" stroke-width="2" filter="url(#shadow)" />
<text x="738" y="770" fill="#1f2933" font-family="Arial, sans-serif" font-size="17">
