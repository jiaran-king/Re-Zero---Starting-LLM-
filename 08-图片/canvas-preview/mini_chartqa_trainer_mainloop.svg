<tspan x="98" dy="22">入口装配 -&gt; rollout -&gt; reward -&gt;</tspan>
<tspan x="98" dy="22">update</tspan>
</text>
<rect x="80" y="210" width="340" height="260" rx="10" fill="#f6ffed" stroke="#389e0d" stroke-width="2" filter="url(#shadow)" />
<text x="98" y="240" fill="#1f2933" font-family="Arial, sans-serif" font-size="17">
