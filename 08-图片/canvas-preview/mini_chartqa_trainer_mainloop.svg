<tspan x="98" dy="22">• 读取 PPOConfig</tspan>
<tspan x="98" dy="22">• deep_post_init</tspan>
<tspan x="98" dy="22">• ray.init</tspan>
<tspan x="98" dy="22">• 启动 Runner</tspan>
</text>
<rect x="455" y="280" width="180" height="120" rx="10" fill="#e6f4ff" stroke="#0958d9" stroke-width="2" filter="url(#shadow)" />
