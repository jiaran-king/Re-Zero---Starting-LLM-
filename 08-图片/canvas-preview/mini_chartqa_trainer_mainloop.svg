<tspan x="1318" dy="22">• first rollout</tspan>
<tspan x="1318" dy="22">• get_second_rollout_batch</tspan>
</text>
<rect x="1035" y="850" width="190" height="120" rx="10" fill="#e6f4ff" stroke="#0958d9" stroke-width="2" filter="url(#shadow)" />
