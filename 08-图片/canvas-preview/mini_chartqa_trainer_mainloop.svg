<tspan x="473" dy="22">Runner.run()</tspan>
<tspan x="473" dy="22">总装训练系统</tspan>
</text>
<rect x="680" y="200" width="390" height="280" rx="10" fill="#f6ffed" stroke="#389e0d" stroke-width="2" filter="url(#shadow)" />
