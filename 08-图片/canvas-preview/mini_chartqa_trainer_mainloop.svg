<tspan x="1513" dy="22">fit()</tspan>
<tspan x="1513" dy="22">取 batch + rollout</tspan>
</text>
<rect x="1300" y="760" width="430" height="300" rx="10" fill="#f6ffed" stroke="#389e0d" stroke-width="2" filter="url(#shadow)" />
<text x="1318" y="790" fill="#1f2933" font-family="Arial, sans-serif" font-size="17">
