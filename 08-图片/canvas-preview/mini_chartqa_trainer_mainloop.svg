<tspan x="738" dy="22">• token_level_rewards</tspan>
<tspan x="738" dy="22">• advantages</tspan>
</text>
<rect x="455" y="850" width="200" height="120" rx="10" fill="#e6f4ff" stroke="#0958d9" stroke-width="2" filter="url(#shadow)" />
<text x="473" y="880" fill="#1f2933" font-family="Arial, sans-serif" font-size="17">
<tspan x="473" dy="0">◇</tspan>
<tspan x="473" dy="22">update + validate</tspan>
<tspan x="473" dy="22">actor / critic / 记录</tspan>
</text>
<rect x="80" y="760" width="340" height="300" rx="10" fill="#f9f0ff" stroke="#722ed1" stroke-width="2" filter="url(#shadow)" />
<text x="98" y="790" fill="#1f2933" font-family="Arial, sans-serif" font-size="17">
<tspan x="98" dy="0">阶段 5｜输出层</tspan>
<tspan x="98" dy="22">• actor update</tspan>
