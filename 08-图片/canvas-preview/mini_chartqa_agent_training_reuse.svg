</text>
<rect x="290" y="775" width="160" height="100" rx="10" fill="#e6f4ff" stroke="#0958d9" stroke-width="2" filter="url(#shadow)" />
<text x="308" y="805" fill="#1f2933" font-family="Arial, sans-serif" font-size="17">
<tspan x="308" dy="0">◇</tspan>
<tspan x="308" dy="22">继续生成</tspan>
</text>
<rect x="-40" y="720" width="240" height="170" rx="10" fill="#f9f0ff" stroke="#722ed1" stroke-width="2" filter="url(#shadow)" />
<text x="-22" y="750" fill="#1f2933" font-family="Arial, sans-serif" font-size="17">
<tspan x="-22" dy="0">second rollout</tspan>
