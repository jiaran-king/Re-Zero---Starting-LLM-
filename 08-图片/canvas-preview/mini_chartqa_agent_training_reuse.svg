</text>
<rect x="80" y="220" width="240" height="170" rx="10" fill="#f6ffed" stroke="#389e0d" stroke-width="2" filter="url(#shadow)" />
<text x="98" y="250" fill="#1f2933" font-family="Arial, sans-serif" font-size="17">
<tspan x="98" dy="0">first rollout</tspan>
</text>
<rect x="370" y="255" width="170" height="100" rx="10" fill="#e6f4ff" stroke="#0958d9" stroke-width="2" filter="url(#shadow)" />
<text x="388" y="285" fill="#1f2933" font-family="Arial, sans-serif" font-size="17">
<tspan x="388" dy="0">◇</tspan>
<tspan x="388" dy="22">parse 当前输出</tspan>
</text>
<rect x="590" y="220" width="260" height="170" rx="10" fill="#f6ffed" stroke="#389e0d" stroke-width="2" filter="url(#shadow)" />
<text x="608" y="250" fill="#1f2933" font-family="Arial, sans-serif" font-size="17">
<tspan x="608" dy="0">执行合法工具代码</tspan>
</text>
<rect x="900" y="560" width="160" height="100" rx="10" fill="#e6f4ff" stroke="#0958d9" stroke-width="2" filter="url(#shadow)" />
<text x="918" y="590" fill="#1f2933" font-family="Arial, sans-serif" font-size="17">
<tspan x="918" dy="0">◇</tspan>
<tspan x="918" dy="22">重组输入</tspan>
</text>
<rect x="560" y="720" width="320" height="190" rx="10" fill="#f6ffed" stroke="#389e0d" stroke-width="2" filter="url(#shadow)" />
<text x="578" y="750" fill="#1f2933" font-family="Arial, sans-serif" font-size="17">
<tspan x="578" dy="0">observation + 两张图</tspan>
<tspan x="578" dy="22">• 原图</tspan>
<tspan x="578" dy="22">• edited image</tspan>
