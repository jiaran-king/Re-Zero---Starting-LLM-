<svg xmlns="http://www.w3.org/2000/svg" viewBox="-80 0 1180 950" width="1600" height="1288">
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L0,6 L9,3 z" fill="#566070" />
</marker>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
<feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#162033" flood-opacity="0.12" />
</filter>
</defs>
<rect x="-80" y="0" width="1180" height="950" fill="#fbfbf8" />
<line x1="320" y1="305" x2="370" y2="305" stroke="#566070" stroke-width="3" marker-end="url(#arrow)" />
<line x1="540" y1="305" x2="590" y2="305" stroke="#566070" stroke-width="3" marker-end="url(#arrow)" />
<line x1="720" y1="390" x2="980" y2="560" stroke="#566070" stroke-width="3" marker-end="url(#arrow)" />
<line x1="900" y1="610" x2="880" y2="815" stroke="#566070" stroke-width="3" marker-end="url(#arrow)" />
<line x1="560" y1="815" x2="450" y2="825" stroke="#566070" stroke-width="3" marker-end="url(#arrow)" />
<line x1="290" y1="825" x2="200" y2="805" stroke="#566070" stroke-width="3" marker-end="url(#arrow)" />
<rect x="80" y="40" width="620" height="100" rx="10" fill="#fff1f0" stroke="#d4380d" stroke-width="2" filter="url(#shadow)" />
<text x="98" y="70" fill="#1f2933" font-family="Arial, sans-serif" font-size="17">
<tspan x="98" dy="0">trainer 复用的不是完整 Agent</tspan>
