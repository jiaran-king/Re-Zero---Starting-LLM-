<rect x="80" y="40" width="500" height="110" rx="10" fill="#fff1f0" stroke="#d4380d" stroke-width="2" filter="url(#shadow)" />
<text x="98" y="70" fill="#1f2933" font-family="Arial, sans-serif" font-size="17">
<tspan x="98" dy="0">DeepSeek-V4 通用系统底座</tspan>
<tspan x="98" dy="22">3.1-3.4 工程主线</tspan>
</text>
<rect x="80" y="230" width="430" height="300" rx="10" fill="#f6ffed" stroke="#389e0d" stroke-width="2" filter="url(#shadow)" />
<text x="98" y="260" fill="#1f2933" font-family="Arial, sans-serif" font-size="17">
<tspan x="98" dy="0">阶段 1｜MoE 专家并行</tspan>
<tspan x="98" dy="22">• token 路由到不同专家</tspan>
<tspan x="98" dy="22">• Dispatch / Combine 通信重</tspan>
<tspan x="98" dy="22">• GPU 容易等待通信</tspan>
</text>
<rect x="535" y="320" width="190" height="120" rx="10" fill="#e6f4ff" stroke="#0958d9" stroke-width="2" filter="url(#shadow)" />
<text x="553" y="350" fill="#1f2933" font-family="Arial, sans-serif" font-size="17">
<tspan x="553" dy="0">◇</tspan>
<tspan x="553" dy="22">wave scheduling</tspan>
<tspan x="553" dy="22">通信计算重叠</tspan>
</text>
<rect x="760" y="230" width="430" height="300" rx="10" fill="#f9f0ff" stroke="#722ed1" stroke-width="2" filter="url(#shadow)" />
<text x="778" y="260" fill="#1f2933" font-family="Arial, sans-serif" font-size="17">
<tspan x="778" dy="0">阶段 2｜专家流水线</tspan>
<tspan x="778" dy="22">• 专家拆成多个 wave</tspan>
<tspan x="778" dy="22">• 到达一批就计算一批</tspan>
<tspan x="778" dy="22">• 隐藏通信延迟</tspan>
</text>
<rect x="1215" y="320" width="180" height="120" rx="10" fill="#e6f4ff" stroke="#0958d9" stroke-width="2" filter="url(#shadow)" />
<text x="1233" y="350" fill="#1f2933" font-family="Arial, sans-serif" font-size="17">
<tspan x="1233" dy="0">◇</tspan>
<tspan x="1233" dy="22">TileLang</tspan>
<tspan x="1233" dy="22">融合复杂算子</tspan>
</text>
<rect x="1430" y="230" width="450" height="300" rx="10" fill="#f6ffed" stroke="#389e0d" stroke-width="2" filter="url(#shadow)" />
<text x="1448" y="260" fill="#1f2933" font-family="Arial, sans-serif" font-size="17">
<tspan x="1448" dy="0">阶段 3｜高性能 kernel</tspan>
<tspan x="1448" dy="22">• Host Codegen 降低调用开销</tspan>
<tspan x="1448" dy="22">• SMT 分析复杂索引</tspan>
<tspan x="1448" dy="22">• 默认保持数值严格</tspan>
</text>
<rect x="1985" y="320" width="210" height="120" rx="10" fill="#e6f4ff" stroke="#0958d9" stroke-width="2" filter="url(#shadow)" />
<text x="2003" y="350" fill="#1f2933" font-family="Arial, sans-serif" font-size="17">
<tspan x="2003" dy="0">◇</tspan>
<tspan x="2003" dy="22">BI + deterministic</tspan>
<tspan x="2003" dy="22">固定计算路径</tspan>
</text>
<rect x="2240" y="230" width="460" height="300" rx="10" fill="#f9f0ff" stroke="#722ed1" stroke-width="2" filter="url(#shadow)" />
<text x="2258" y="260" fill="#1f2933" font-family="Arial, sans-serif" font-size="17">
<tspan x="2258" dy="0">阶段 4｜可复现 kernel 库</tspan>
<tspan x="2258" dy="22">• batch 组合不改变 token 输出</tspan>
<tspan x="2258" dy="22">• 重复运行结果一致</tspan>
<tspan x="2258" dy="22">• 避免非确定性 atomicAdd</tspan>
</text>
<rect x="2370" y="585" width="185" height="120" rx="10" fill="#e6f4ff" stroke="#0958d9" stroke-width="2" filter="url(#shadow)" />
<text x="2388" y="615" fill="#1f2933" font-family="Arial, sans-serif" font-size="17">
<tspan x="2388" dy="0">◇</tspan>
<tspan x="2388" dy="22">FP4 QAT</tspan>
<tspan x="2388" dy="22">提前适应量化</tspan>
</text>
<rect x="2240" y="760" width="460" height="320" rx="10" fill="#f9f0ff" stroke="#722ed1" stroke-width="2" filter="url(#shadow)" />
<text x="2258" y="790" fill="#1f2933" font-family="Arial, sans-serif" font-size="17">
<tspan x="2258" dy="0">阶段 5｜低精度执行</tspan>
<tspan x="2258" dy="22">• MoE expert weights 使用 FP4</tspan>
<tspan x="2258" dy="22">• CSA indexer QK path 使用 FP4</tspan>
<tspan x="2258" dy="22">• rollout / inference 使用真实 FP4</tspan>
</text>
<rect x="1980" y="860" width="210" height="120" rx="10" fill="#e6f4ff" stroke="#0958d9" stroke-width="2" filter="url(#shadow)" />
<text x="1998" y="890" fill="#1f2933" font-family="Arial, sans-serif" font-size="17">
<tspan x="1998" dy="0">◇</tspan>
<tspan x="1998" dy="22">系统收益</tspan>
<tspan x="1998" dy="22">速度 / 显存 / 稳定性</tspan>
</text>
<rect x="1430" y="745" width="450" height="350" rx="10" fill="#f9f0ff" stroke="#722ed1" stroke-width="2" filter="url(#shadow)" />
<text x="1448" y="775" fill="#1f2933" font-family="Arial, sans-serif" font-size="17">
<tspan x="1448" dy="0">最终目标｜复杂模型可落地</tspan>
<tspan x="1448" dy="22">• MoE 跑得快</tspan>
<tspan x="1448" dy="22">• kernel 写得快</tspan>
<tspan x="1448" dy="22">• 结果可复现</tspan>
<tspan x="1448" dy="22">• 长上下文和低精度可部署</tspan>
</text>
<rect x="80" y="760" width="470" height="240" rx="10" fill="#f0f5ff" stroke="#1d39c4" stroke-width="2" filter="url(#shadow)" />
<text x="98" y="790" fill="#1f2933" font-family="Arial, sans-serif" font-size="17">
<tspan x="98" dy="0">读图方式</tspan>
<tspan x="98" dy="22">• 大卡片：工程问题 / 系统状态</tspan>
<tspan x="98" dy="22">• 小卡片：关键技术动作</tspan>
<tspan x="98" dy="22">• 上排解释从通信到 kernel</tspan>
<tspan x="98" dy="22">• 下排解释从量化到落地</tspan>
</text>
</svg>
