</text>
<rect x="1250" y="1200" width="280" height="180" rx="10" fill="#f9f0ff" stroke="#722ed1" stroke-width="2" filter="url(#shadow)" />
<text x="1268" y="1230" fill="#1f2933" font-family="Arial, sans-serif" font-size="17">
