<rect x="80" y="40" width="650" height="105" rx="10" fill="#fff1f0" stroke="#d4380d" stroke-width="2" filter="url(#shadow)" />
<text x="98" y="70" fill="#1f2933" font-family="Arial, sans-serif" font-size="17">
<tspan x="98" dy="0">Scheduler 与 Continuous</tspan>
<tspan x="98" dy="22">Batching</tspan>
<tspan x="98" dy="22">每个 engine step 重新组 batch</tspan>
</text>
<rect x="2040" y="40" width="430" height="230" rx="10" fill="#f0f5ff" stroke="#1d39c4" stroke-width="2" filter="url(#shadow)" />
<text x="2058" y="70" fill="#1f2933" font-family="Arial, sans-serif" font-size="17">
<tspan x="2058" dy="0">读图方式</tspan>
<tspan x="2058" dy="22">• 大卡片：队列 / 资源 / 结果</tspan>
<tspan x="2058" dy="22">• 小卡片：调度动作</tspan>
<tspan x="2058" dy="22">• 上排收集状态</tspan>
<tspan x="2058" dy="22">• 下排执行并回写</tspan>
</text>
<rect x="80" y="230" width="390" height="300" rx="10" fill="#f6ffed" stroke="#389e0d" stroke-width="2" filter="url(#shadow)" />
<text x="98" y="260" fill="#1f2933" font-family="Arial, sans-serif" font-size="17">
<tspan x="98" dy="0">Waiting Requests</tspan>
<tspan x="98" dy="22">• 新请求</tspan>
<tspan x="98" dy="22">• prompt tokens</tspan>
<tspan x="98" dy="22">• sampling params</tspan>
<tspan x="98" dy="22">• arrival time</tspan>
</text>
<rect x="500" y="325" width="190" height="120" rx="10" fill="#e6f4ff" stroke="#0958d9" stroke-width="2" filter="url(#shadow)" />
<text x="518" y="355" fill="#1f2933" font-family="Arial, sans-serif" font-size="17">
<tspan x="518" dy="0">◇</tspan>
<tspan x="518" dy="22">admit</tspan>
<tspan x="518" dy="22">选择 prefill</tspan>
</text>
<rect x="720" y="230" width="390" height="300" rx="10" fill="#f6ffed" stroke="#389e0d" stroke-width="2" filter="url(#shadow)" />
<text x="738" y="260" fill="#1f2933" font-family="Arial, sans-serif" font-size="17">
<tspan x="738" dy="0">Running Requests</tspan>
<tspan x="738" dy="22">• decode 中</tspan>
<tspan x="738" dy="22">• 已持有 KV blocks</tspan>
<tspan x="738" dy="22">• generated tokens</tspan>
<tspan x="738" dy="22">• stop 状态</tspan>
</text>
<rect x="1140" y="325" width="190" height="120" rx="10" fill="#e6f4ff" stroke="#0958d9" stroke-width="2" filter="url(#shadow)" />
<text x="1158" y="355" fill="#1f2933" font-family="Arial, sans-serif" font-size="17">
<tspan x="1158" dy="0">◇</tspan>
<tspan x="1158" dy="22">budget</tspan>
<tspan x="1158" dy="22">检查资源</tspan>
</text>
<rect x="1360" y="230" width="390" height="300" rx="10" fill="#f6ffed" stroke="#389e0d" stroke-width="2" filter="url(#shadow)" />
<text x="1378" y="260" fill="#1f2933" font-family="Arial, sans-serif" font-size="17">
<tspan x="1378" dy="0">Step Budgets</tspan>
<tspan x="1378" dy="22">• token budget</tspan>
<tspan x="1378" dy="22">• KV cache blocks</tspan>
<tspan x="1378" dy="22">• max_num_seqs</tspan>
<tspan x="1378" dy="22">• priority</tspan>
</text>
<rect x="1780" y="325" width="200" height="120" rx="10" fill="#e6f4ff" stroke="#0958d9" stroke-width="2" filter="url(#shadow)" />
<text x="1798" y="355" fill="#1f2933" font-family="Arial, sans-serif" font-size="17">
<tspan x="1798" dy="0">◇</tspan>
<tspan x="1798" dy="22">schedule</tspan>
<tspan x="1798" dy="22">形成本轮 batch</tspan>
</text>
<rect x="2010" y="230" width="400" height="300" rx="10" fill="#f6ffed" stroke="#389e0d" stroke-width="2" filter="url(#shadow)" />
<text x="2028" y="260" fill="#1f2933" font-family="Arial, sans-serif" font-size="17">
<tspan x="2028" dy="0">Scheduled Batch</tspan>
<tspan x="2028" dy="22">• prefill chunks</tspan>
<tspan x="2028" dy="22">• decode tokens</tspan>
<tspan x="2028" dy="22">• block table</tspan>
<tspan x="2028" dy="22">• worker inputs</tspan>
</text>
<rect x="2120" y="585" width="200" height="120" rx="10" fill="#e6f4ff" stroke="#0958d9" stroke-width="2" filter="url(#shadow)" />
<text x="2138" y="615" fill="#1f2933" font-family="Arial, sans-serif" font-size="17">
<tspan x="2138" dy="0">◇</tspan>
<tspan x="2138" dy="22">execute</tspan>
<tspan x="2138" dy="22">GPU forward</tspan>
</text>
<rect x="2010" y="760" width="400" height="300" rx="10" fill="#f9f0ff" stroke="#722ed1" stroke-width="2" filter="url(#shadow)" />
<text x="2028" y="790" fill="#1f2933" font-family="Arial, sans-serif" font-size="17">
<tspan x="2028" dy="0">Worker Outputs</tspan>
<tspan x="2028" dy="22">• logits</tspan>
<tspan x="2028" dy="22">• sampled token</tspan>
<tspan x="2028" dy="22">• logprobs optional</tspan>
<tspan x="2028" dy="22">• updated KV</tspan>
</text>
<rect x="1780" y="855" width="200" height="120" rx="10" fill="#e6f4ff" stroke="#0958d9" stroke-width="2" filter="url(#shadow)" />
<text x="1798" y="885" fill="#1f2933" font-family="Arial, sans-serif" font-size="17">
<tspan x="1798" dy="0">◇</tspan>
<tspan x="1798" dy="22">postprocess</tspan>
<tspan x="1798" dy="22">停止与流式返回</tspan>
</text>
<rect x="1360" y="760" width="390" height="300" rx="10" fill="#f9f0ff" stroke="#722ed1" stroke-width="2" filter="url(#shadow)" />
<text x="1378" y="790" fill="#1f2933" font-family="Arial, sans-serif" font-size="17">
<tspan x="1378" dy="0">State Update</tspan>
<tspan x="1378" dy="22">• finished 离开</tspan>
<tspan x="1378" dy="22">• running 继续</tspan>
<tspan x="1378" dy="22">• new request 可加入</tspan>
<tspan x="1378" dy="22">• metrics 更新</tspan>
</text>
<rect x="1140" y="855" width="190" height="120" rx="10" fill="#e6f4ff" stroke="#0958d9" stroke-width="2" filter="url(#shadow)" />
<text x="1158" y="885" fill="#1f2933" font-family="Arial, sans-serif" font-size="17">
<tspan x="1158" dy="0">◇</tspan>
<tspan x="1158" dy="22">next step</tspan>
<tspan x="1158" dy="22">重新调度</tspan>
</text>
<rect x="720" y="760" width="390" height="300" rx="10" fill="#f9f0ff" stroke="#722ed1" stroke-width="2" filter="url(#shadow)" />
<text x="738" y="790" fill="#1f2933" font-family="Arial, sans-serif" font-size="17">
<tspan x="738" dy="0">Continuous Batch</tspan>
<tspan x="738" dy="22">• batch 每步变化</tspan>
<tspan x="738" dy="22">• 短请求不空等</tspan>
<tspan x="738" dy="22">• 长 prompt 可切块</tspan>
<tspan x="738" dy="22">• GPU 保持有活</tspan>
</text>
<rect x="500" y="855" width="190" height="120" rx="10" fill="#e6f4ff" stroke="#0958d9" stroke-width="2" filter="url(#shadow)" />
<text x="518" y="885" fill="#1f2933" font-family="Arial, sans-serif" font-size="17">
<tspan x="518" dy="0">◇</tspan>
<tspan x="518" dy="22">preempt</tspan>
<tspan x="518" dy="22">资源不足取舍</tspan>
</text>
<rect x="80" y="760" width="390" height="300" rx="10" fill="#f0f5ff" stroke="#1d39c4" stroke-width="2" filter="url(#shadow)" />
<text x="98" y="790" fill="#1f2933" font-family="Arial, sans-serif" font-size="17">
<tspan x="98" dy="0">Resource Pressure</tspan>
<tspan x="98" dy="22">• KV block 不足</tspan>
<tspan x="98" dy="22">• prefill 太长</tspan>
<tspan x="98" dy="22">• active seq 太多</tspan>
<tspan x="98" dy="22">• tail latency 上升</tspan>
</text>
</svg>
