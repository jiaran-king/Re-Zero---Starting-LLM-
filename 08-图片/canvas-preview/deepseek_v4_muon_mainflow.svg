<feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#162033" flood-opacity="0.12" />
</filter>
</defs>
<rect x="40" y="-105" width="2500" height="1235" fill="#fbfbf8" />
<line x1="500" y1="380" x2="525" y2="380" stroke="#566070" stroke-width="3" marker-end="url(#arrow)" />
