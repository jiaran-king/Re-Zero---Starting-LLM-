<line x1="1170" y1="360" x2="1200" y2="365" stroke="#566070" stroke-width="3" marker-end="url(#arrow)" />
<line x1="1380" y1="365" x2="1420" y2="360" stroke="#566070" stroke-width="3" marker-end="url(#arrow)" />
