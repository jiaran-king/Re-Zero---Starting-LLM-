<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 0 1720 690" width="1600" height="641">
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L0,6 L9,3 z" fill="#566070" />
</marker>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
<feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#162033" flood-opacity="0.12" />
</filter>
</defs>
<rect x="40" y="0" width="1720" height="690" fill="#fbfbf8" />
<line x1="320" y1="290" x2="420" y2="290" stroke="#566070" stroke-width="3" marker-end="url(#arrow)" />
<line x1="530" y1="360" x2="530" y2="470" stroke="#566070" stroke-width="3" marker-end="url(#arrow)" />
<line x1="640" y1="290" x2="760" y2="290" stroke="#566070" stroke-width="3" marker-end="url(#arrow)" />
<line x1="870" y1="360" x2="890" y2="470" stroke="#566070" stroke-width="3" marker-end="url(#arrow)" />
<line x1="980" y1="290" x2="1110" y2="290" stroke="#566070" stroke-width="3" marker-end="url(#arrow)" />
<line x1="1210" y1="360" x2="1240" y2="470" stroke="#566070" stroke-width="3" marker-end="url(#arrow)" />
<line x1="1310" y1="290" x2="1460" y2="310" stroke="#566070" stroke-width="3" marker-end="url(#arrow)" />
<rect x="80" y="40" width="360" height="100" rx="10" fill="#fff1f0" stroke="#d4380d" stroke-width="2" filter="url(#shadow)" />
