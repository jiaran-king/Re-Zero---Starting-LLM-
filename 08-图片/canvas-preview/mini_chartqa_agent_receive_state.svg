</text>
<rect x="80" y="220" width="240" height="140" rx="10" fill="#f6ffed" stroke="#389e0d" stroke-width="2" filter="url(#shadow)" />
<text x="98" y="250" fill="#1f2933" font-family="Arial, sans-serif" font-size="17">
<tspan x="98" dy="0">收到 planner 回复</tspan>
</text>
<rect x="420" y="220" width="220" height="140" rx="10" fill="#e6f4ff" stroke="#0958d9" stroke-width="2" filter="url(#shadow)" />
<text x="438" y="250" fill="#1f2933" font-family="Arial, sans-serif" font-size="17">
<tspan x="438" dy="0">terminate 检查</tspan>
</text>
<rect x="420" y="470" width="220" height="150" rx="10" fill="#f9f0ff" stroke="#722ed1" stroke-width="2" filter="url(#shadow)" />
<text x="438" y="500" fill="#1f2933" font-family="Arial, sans-serif" font-size="17">
<tspan x="438" dy="0">已终止</tspan>
<tspan x="438" dy="22">• 停止本轮</tspan>
</text>
<rect x="760" y="220" width="220" height="140" rx="10" fill="#e6f4ff" stroke="#0958d9" stroke-width="2" filter="url(#shadow)" />
<text x="778" y="250" fill="#1f2933" font-family="Arial, sans-serif" font-size="17">
<tspan x="778" dy="0">进入 parse</tspan>
</text>
<rect x="760" y="470" width="260" height="180" rx="10" fill="#f6ffed" stroke="#389e0d" stroke-width="2" filter="url(#shadow)" />
<text x="778" y="500" fill="#1f2933" font-family="Arial, sans-serif" font-size="17">
<tspan x="778" dy="0">parsing feedback</tspan>
<tspan x="778" dy="22">• 解析失败</tspan>
<tspan x="778" dy="22">• 继续回给 planner</tspan>
</text>
<rect x="1110" y="220" width="200" height="140" rx="10" fill="#e6f4ff" stroke="#0958d9" stroke-width="2" filter="url(#shadow)" />
<text x="1128" y="250" fill="#1f2933" font-family="Arial, sans-serif" font-size="17">
<tspan x="1128" dy="0">execute</tspan>
</text>
