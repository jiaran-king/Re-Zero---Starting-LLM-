</text>
<rect x="1460" y="220" width="260" height="180" rx="10" fill="#f9f0ff" stroke="#722ed1" stroke-width="2" filter="url(#shadow)" />
<text x="1478" y="250" fill="#1f2933" font-family="Arial, sans-serif" font-size="17">
