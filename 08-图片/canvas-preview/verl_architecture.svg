<rect x="80" y="40" width="560" height="110" rx="10" fill="#fff1f0" stroke="#d4380d" stroke-width="2" filter="url(#shadow)" />
<text x="98" y="70" fill="#1f2933" font-family="Arial, sans-serif" font-size="17">
<tspan x="98" dy="0">Verl 系统架构总览</tspan>
<tspan x="98" dy="22">Single Controller +</tspan>
<tspan x="98" dy="22">Distributed Workers</tspan>
</text>
<rect x="2170" y="50" width="410" height="220" rx="10" fill="#f0f5ff" stroke="#1d39c4" stroke-width="2" filter="url(#shadow)" />
<text x="2188" y="80" fill="#1f2933" font-family="Arial, sans-serif" font-size="17">
<tspan x="2188" dy="0">读图方式</tspan>
<tspan x="2188" dy="22">• 大卡片：系统角色 / 计算层</tspan>
<tspan x="2188" dy="22">• 小卡片：调度或适配动作</tspan>
<tspan x="2188" dy="22">• 上排看控制到 worker</tspan>
<tspan x="2188" dy="22">• 下排看 backend 与 checkpoint</tspan>
</text>
<rect x="80" y="240" width="430" height="330" rx="10" fill="#f6ffed" stroke="#389e0d" stroke-width="2" filter="url(#shadow)" />
<text x="98" y="270" fill="#1f2933" font-family="Arial, sans-serif" font-size="17">
<tspan x="98" dy="0">阶段 1｜Controller / Trainer</tspan>
<tspan x="98" dy="22">• 写 RL 主循环</tspan>
<tspan x="98" dy="22">• 调度 rollout / reward / update</tspan>
<tspan x="98" dy="22">• 记录 metrics</tspan>
<tspan x="98" dy="22">• 不直接做重计算</tspan>
</text>
<rect x="540" y="345" width="190" height="120" rx="10" fill="#e6f4ff" stroke="#0958d9" stroke-width="2" filter="url(#shadow)" />
<text x="558" y="375" fill="#1f2933" font-family="Arial, sans-serif" font-size="17">
<tspan x="558" dy="0">◇</tspan>
<tspan x="558" dy="22">WorkerGroup RPC</tspan>
<tspan x="558" dy="22">远程调用</tspan>
</text>
<rect x="770" y="240" width="450" height="330" rx="10" fill="#f6ffed" stroke="#389e0d" stroke-width="2" filter="url(#shadow)" />
<text x="788" y="270" fill="#1f2933" font-family="Arial, sans-serif" font-size="17">
<tspan x="788" dy="0">阶段 2｜Role Workers</tspan>
<tspan x="788" dy="22">• ActorRolloutRefWorker</tspan>
<tspan x="788" dy="22">• Critic Worker</tspan>
<tspan x="788" dy="22">• Reward Worker / Manager</tspan>
<tspan x="788" dy="22">• 按角色执行任务</tspan>
</text>
<rect x="1250" y="345" width="190" height="120" rx="10" fill="#e6f4ff" stroke="#0958d9" stroke-width="2" filter="url(#shadow)" />
<text x="1268" y="375" fill="#1f2933" font-family="Arial, sans-serif" font-size="17">
<tspan x="1268" dy="0">◇</tspan>
<tspan x="1268" dy="22">dispatch_mode</tspan>
<tspan x="1268" dy="22">分发 / 收集</tspan>
</text>
<rect x="1480" y="240" width="430" height="330" rx="10" fill="#f6ffed" stroke="#389e0d" stroke-width="2" filter="url(#shadow)" />
<text x="1498" y="270" fill="#1f2933" font-family="Arial, sans-serif" font-size="17">
<tspan x="1498" dy="0">阶段 3｜Training Worker</tspan>
<tspan x="1498" dy="22">• infer_batch</tspan>
<tspan x="1498" dy="22">• train_mini_batch</tspan>
<tspan x="1498" dy="22">• train_batch</tspan>
<tspan x="1498" dy="22">• 绑定 loss_fn</tspan>
</text>
<rect x="1940" y="345" width="190" height="120" rx="10" fill="#e6f4ff" stroke="#0958d9" stroke-width="2" filter="url(#shadow)" />
<text x="1958" y="375" fill="#1f2933" font-family="Arial, sans-serif" font-size="17">
<tspan x="1958" dy="0">◇</tspan>
<tspan x="1958" dy="22">EngineRegistry</tspan>
<tspan x="1958" dy="22">选择 backend</tspan>
</text>
<rect x="2170" y="240" width="430" height="330" rx="10" fill="#f9f0ff" stroke="#722ed1" stroke-width="2" filter="url(#shadow)" />
<text x="2188" y="270" fill="#1f2933" font-family="Arial, sans-serif" font-size="17">
<tspan x="2188" dy="0">阶段 4｜Model Engine</tspan>
<tspan x="2188" dy="22">• FSDP / FSDP2</tspan>
<tspan x="2188" dy="22">• Megatron / Automodel</tspan>
<tspan x="2188" dy="22">• forward / backward</tspan>
<tspan x="2188" dy="22">• optimizer / sharding</tspan>
</text>
<rect x="1990" y="710" width="190" height="120" rx="10" fill="#e6f4ff" stroke="#0958d9" stroke-width="2" filter="url(#shadow)" />
<text x="2008" y="740" fill="#1f2933" font-family="Arial, sans-serif" font-size="17">
<tspan x="2008" dy="0">◇</tspan>
<tspan x="2008" dy="22">BaseRollout</tspan>
<tspan x="2008" dy="22">生成 response</tspan>
</text>
<rect x="1480" y="650" width="430" height="330" rx="10" fill="#f6ffed" stroke="#389e0d" stroke-width="2" filter="url(#shadow)" />
<text x="1498" y="680" fill="#1f2933" font-family="Arial, sans-serif" font-size="17">
<tspan x="1498" dy="0">阶段 5｜Rollout Engine</tspan>
<tspan x="1498" dy="22">• vLLM / SGLang / HF</tspan>
<tspan x="1498" dy="22">• 高吞吐采样</tspan>
<tspan x="1498" dy="22">• responses / masks</tspan>
<tspan x="1498" dy="22">• rollout logprobs</tspan>
</text>
<rect x="1250" y="755" width="190" height="120" rx="10" fill="#e6f4ff" stroke="#0958d9" stroke-width="2" filter="url(#shadow)" />
<text x="1268" y="785" fill="#1f2933" font-family="Arial, sans-serif" font-size="17">
<tspan x="1268" dy="0">◇</tspan>
<tspan x="1268" dy="22">update_weights</tspan>
<tspan x="1268" dy="22">同步策略</tspan>
</text>
<rect x="770" y="650" width="450" height="330" rx="10" fill="#f9f0ff" stroke="#722ed1" stroke-width="2" filter="url(#shadow)" />
<text x="788" y="680" fill="#1f2933" font-family="Arial, sans-serif" font-size="17">
<tspan x="788" dy="0">阶段 6｜Latest Policy</tspan>
<tspan x="788" dy="22">• actor 已更新</tspan>
<tspan x="788" dy="22">• rollout 拿到新权重</tspan>
<tspan x="788" dy="22">• 下一批采样使用新策略</tspan>
<tspan x="788" dy="22">• 闭环继续训练</tspan>
</text>
<rect x="540" y="755" width="190" height="120" rx="10" fill="#e6f4ff" stroke="#0958d9" stroke-width="2" filter="url(#shadow)" />
<text x="558" y="785" fill="#1f2933" font-family="Arial, sans-serif" font-size="17">
<tspan x="558" dy="0">◇</tspan>
<tspan x="558" dy="22">save_checkpoint</tspan>
<tspan x="558" dy="22">分片保存</tspan>
</text>
<rect x="80" y="650" width="430" height="330" rx="10" fill="#f9f0ff" stroke="#722ed1" stroke-width="2" filter="url(#shadow)" />
<text x="98" y="680" fill="#1f2933" font-family="Arial, sans-serif" font-size="17">
<tspan x="98" dy="0">阶段 7｜Checkpoint</tspan>
<tspan x="98" dy="22">• actor / critic shard</tspan>
<tspan x="98" dy="22">• optimizer / scheduler</tspan>
<tspan x="98" dy="22">• extra state / RNG</tspan>
<tspan x="98" dy="22">• merge 导出 HF 模型</tspan>
</text>
</svg>
