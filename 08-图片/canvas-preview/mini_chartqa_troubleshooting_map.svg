<rect x="1180" y="480" width="360" height="290" rx="10" fill="#f6ffed" stroke="#389e0d" stroke-width="2" filter="url(#shadow)" />
<text x="1198" y="510" fill="#1f2933" font-family="Arial, sans-serif" font-size="17">
